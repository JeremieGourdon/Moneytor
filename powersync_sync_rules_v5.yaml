# Moneytor PowerSync Sync Rules (Modern Sync Streams)
# Version: 5.0 (Optimized for PowerSync Parser - No UNION in subqueries)
# Documentation: https://docs.powersync.com/sync/streams/overview

streams:
  # 1. USER PROFILE
  user_profile:
    auto_subscribe: true
    queries:
      - SELECT * FROM users WHERE id = auth.user_id()
      - SELECT * FROM notifications WHERE user_id = auth.user_id()

  # 2. PERSONAL HOUSEHOLD DATA
  # Syncs everything linked to the user's primary household
  personal_household_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM households WHERE id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      - SELECT * FROM accounts WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      - SELECT * FROM budgets WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      - SELECT * FROM projects WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      - SELECT * FROM categories WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      - SELECT * FROM financial_periods WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      - SELECT * FROM recurring_templates WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())
      # Transactions for personal household
      - |
        SELECT * FROM transactions 
        WHERE household_id IN (SELECT household_id FROM users WHERE id = auth.user_id())

  # 3. SHARED HOUSEHOLD DATA
  # Syncs everything linked to the user's shared household (if any)
  shared_household_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM households WHERE id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      - SELECT * FROM accounts WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      - SELECT * FROM budgets WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      - SELECT * FROM projects WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      - SELECT * FROM categories WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      - SELECT * FROM financial_periods WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      - SELECT * FROM recurring_templates WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)
      # Transactions for shared household
      - |
        SELECT * FROM transactions 
        WHERE household_id IN (SELECT shared_household_id FROM users WHERE id = auth.user_id() AND shared_household_id IS NOT NULL)

  # 4. PRIVATE ACCOUNTS (OWNER SPECIFIC)
  # Even if not in the current household bucket, sync the user's own accounts
  private_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM accounts WHERE owner_id = auth.user_id() AND is_public = FALSE
      - |
        SELECT * FROM budgets 
        WHERE account_id IN (SELECT id FROM accounts WHERE owner_id = auth.user_id() AND is_public = FALSE)
      - |
        SELECT * FROM projects 
        WHERE account_id IN (SELECT id FROM accounts WHERE owner_id = auth.user_id() AND is_public = FALSE)
      - |
        SELECT * FROM transactions 
        WHERE account_id IN (SELECT id FROM accounts WHERE owner_id = auth.user_id() AND is_public = FALSE)
