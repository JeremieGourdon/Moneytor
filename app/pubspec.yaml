name: moneytor
description: "Professional, local-first, multi-platform personal finance application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  device_info_plus: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_lucide: ^1.11.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  powersync: ^2.1.0
  purchases_flutter: ^10.0.2
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  sqlite_async: ^0.14.1
  supabase_flutter: ^2.12.4
  table_calendar: ^3.2.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/branding/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/branding/splash_logo.png"
  android: true
  ios: true
  web: true
  
  # Reduce margins to make logo bigger
  android_gravity: center
  ios_content_mode: center
  
  android_12:
    image: "assets/branding/splash_logo.png"
    color: "#ffffff"
    icon_background_color: "#ffffff"
