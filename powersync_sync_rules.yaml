# PowerSync Sync Rules for Moneytor
# This file defines how data is filtered and synced to local devices.

bucket_definitions:
  # 1. Global Household Bucket: Everything shared within the household
  household_data:
    parameters:
      - household_id
    data:
      - table: households
        select: SELECT * FROM households WHERE id = ?
      - table: users
        select: SELECT * FROM users WHERE household_id = ?
      - table: projects
        select: SELECT * FROM projects WHERE household_id = ?
      - table: categories
        select: SELECT * FROM categories WHERE household_id = ?
      - table: financial_periods
        select: SELECT * FROM financial_periods WHERE household_id = ?
      - table: notifications
        select: SELECT * FROM notifications WHERE household_id = ? AND user_id = token_id()
      
      # Shared budgets and their templates
      - table: budgets
        select: SELECT * FROM budgets WHERE household_id = ?
      - table: recurring_templates
        select: SELECT * FROM recurring_templates WHERE household_id = ?

      # Public accounts and their transactions
      - table: accounts
        select: SELECT * FROM accounts WHERE household_id = ? AND is_public = TRUE
      - table: transactions
        select: |
          SELECT t.* FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE t.household_id = ? AND a.is_public = TRUE

  # 2. Private Account Bucket: Syncs ONLY to the owner's device
  user_private_data:
    parameters:
      - user_id
    data:
      - table: accounts
        select: SELECT * FROM accounts WHERE owner_id = ? AND is_public = FALSE
      - table: transactions
        select: |
          SELECT t.* FROM transactions t
          JOIN accounts a ON t.account_id = a.id
          WHERE a.owner_id = ? AND a.is_public = FALSE
